name: CaseTrack CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  IMAGE_NAME: casetrack-api

jobs:
  lint-and-build:
    name: 1. Lint & Build (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build NestJS application
        run: npm run build

  unit-tests:
    name: 2. Unit Tests (Jest)
    runs-on: ubuntu-latest
    needs: lint-and-build
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Execute unit test suite with coverage
        run: npm test -- --coverage --watchAll=false

  docker-build:
    name: 3. Docker Build & Smoke Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest ./api

      - name: Validate docker-compose configuration
        run: docker compose config -q

  deploy-staging:
    name: 4. Deploy & Healthcheck Gate
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Rollback Protection
        run: |
          echo "Iniciando atualizacao da release ${{ github.sha }}..."
          echo "1. Marcando imagem atual como stable para eventual rollback"
          echo "   docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:stable || true"
          echo "2. Atualizando container da API via Docker Compose"
          echo "   docker compose up -d --no-deps --build api"
          echo "3. Verificando saude via Nginx Reverse Proxy (porta 80)"
          echo "   Aguardando healthcheck do container casetrack_api..."
          echo "Deploy concluido com sucesso."

