services:
  mysqldb:
    image: mysql:8.0
    container_name: audiovisual-gestao-db-mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    env_file: .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techacademy-network
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: casetrack-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techacademy-network
    volumes:
      - redis_data:/data

  api:
    build: ./api
    container_name: nest-js-app
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "3000"
    depends_on:
      mysqldb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - techacademy-network

  nginx:
    image: nginx:alpine
    container_name: casetrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - techacademy-network

networks:
  techacademy-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  dbeaver_data:
